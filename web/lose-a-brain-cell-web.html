<title>Lose a Brain Cell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;700;900&family=Cormorant+Garamond:wght@700&family=Comic+Neue:wght@700&family=Permanent+Marker&display=swap">
<style>
/* Layout: one full-screen canvas town; HUD pinned to the corners; panels slide over it. Single bright game look (no light/dark switch). */
:root{
  --ink:#1c1626; --paper:#fffcf5; --pink:#ff4f9a; --blue:#3a7bff; --gold:#ffd23c; --good:#2fbf71; --bad:#e5484d;
  --panel:#1f1a2b; --panel2:#2c2540; --muted:#a79fbd;
  --display:"Fredoka",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#0e0b15;color:#fff;font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--display);cursor:pointer;border:none;color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.o{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000}
.o1{text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.hide{display:none!important}
/* HUD */
#counter{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));padding:7px 12px;border-radius:14px;border:3px solid #000;z-index:20;font-family:var(--display);min-width:190px;max-width:62vw}
#counter .c{font-size:clamp(17px,4.6vw,24px);line-height:1.1;font-variant-numeric:tabular-nums}
#counter .i{font-size:12px;opacity:.95;margin-top:2px}
#counter .r{font-size:11px;opacity:.85}
#chips{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;z-index:20;max-width:70vw}
.chip{background:rgba(0,0,0,.55);border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700}
#corner{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:20}
.rb{width:46px;height:46px;border-radius:50%;font-size:22px;background:#241d33;border:2px solid #000;display:flex;align-items:center;justify-content:center}
#phoneBtn{background:linear-gradient(#9b5cff,#6a2cd8)}
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));z-index:20;font-family:var(--display)}
.bar{height:26px;border-radius:14px;border:3px solid #000;position:relative;overflow:hidden;background:rgba(0,0,0,.5)}
.bar .f{position:absolute;left:2px;top:2px;bottom:2px;border-radius:10px;transition:width .4s}
.bar .t{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:13px}
.meter{height:10px;border-radius:6px;background:rgba(0,0,0,.5);margin-top:5px;position:relative;overflow:hidden}
.meter .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .4s}
.meter .half{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff}
.ml{font-size:11px;text-align:center;margin-top:2px}
#enterBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:21;display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:12px;background:rgba(25,27,29,.8);color:#fff;font-family:var(--body);text-shadow:none}
#enterBtn .key{width:36px;height:36px;border-radius:9px;background:#fff;color:#111;font:800 18px var(--body);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 #b9b9b9}
#enterBtn .pt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}#enterBtn .pt small{font:500 11px var(--body);opacity:.8}#enterBtn .pt b{font:700 16px var(--body)}
#joy{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);z-index:19;pointer-events:none}#knob{position:absolute;left:28px;top:28px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.65)}
#jumpBtn{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);font-size:30px;z-index:21;display:none;align-items:center;justify-content:center;touch-action:none}body.touch #jumpBtn{display:flex}
#vision{position:absolute;inset:0;pointer-events:none;z-index:15}.v-fly{background-image:radial-gradient(circle,transparent 62%,rgba(0,0,0,.16) 66%);background-size:34px 30px}.v-worm{background:radial-gradient(circle at 50% 55%,transparent 10%,rgba(0,0,0,.95) 42%)}.v-bee{background:radial-gradient(circle,transparent 45%,rgba(255,190,0,.28))}
.drop{position:absolute;top:-40px;font-size:28px;z-index:16;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
#hintHelp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;font:600 11px var(--body);color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:10px;white-space:nowrap;pointer-events:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(420px,calc(100% - 24px));z-index:22;background:linear-gradient(#468cff,#1e50c8);border:3px solid #0a2878;border-radius:16px;padding:8px 12px 9px 64px;min-height:70px}
#hint .em{position:absolute;left:10px;top:10px;font-size:40px}
#hint .s{font:900 11px var(--body);color:var(--gold);letter-spacing:.5px}
#hint .t{font:700 19px var(--display)}
#hint .d{font:700 12px var(--body);color:#e6f0ff;line-height:1.3}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 24px))}
.toast{background:rgba(20,16,30,.92);border:2px solid #000;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.delta{position:absolute;z-index:25;font:700 18px var(--display);pointer-events:none;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
/* panels */
#panelWrap{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:3px solid #000;border-radius:20px;padding:14px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.4)}
.panel.phone{width:min(360px,100%);height:min(700px,100%);background:#0e0e12;border:8px solid #050507;border-radius:36px;padding:34px 12px 14px}
.panel h2{font:700 22px var(--display);margin:0 30px 10px 0}
.panel p{font-size:15px;line-height:1.45;margin:0 0 10px}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:#3a3150;font-size:16px}
.phone .x{top:6px}
.btn{display:block;width:100%;padding:12px;border-radius:14px;font-size:16px;margin-top:8px;background:#3d3458;border:2px solid #000;text-align:left;line-height:1.25}
.btn.go{background:linear-gradient(#2fd27f,#1a9a58);text-align:center}
.btn.pink{background:linear-gradient(#ff6fb0,#e0337e);text-align:center}
.btn small{display:block;font:500 12px var(--body);opacity:.85;margin-top:2px}
.btn.right{background:var(--good)}.btn.wrong{background:var(--bad)}
.btn[disabled]{opacity:.45}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;margin-top:10px}
.app{background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px var(--display)}
.app span{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid rgba(0,0,0,.4)}
.wall{border-radius:18px;padding:16px;text-align:center;background:linear-gradient(135deg,#7a46ff,#ff5aa9);margin-bottom:6px}
.wall b{display:block;font:700 40px var(--display)}
.card{background:#2c2540;border-radius:14px;padding:10px 12px;margin-top:8px}
.room{border-radius:16px;height:150px;position:relative;overflow:hidden;margin-bottom:8px;border:3px solid #000}
.room .fl{position:absolute;left:0;right:0;bottom:0;height:45%}
.room .it{position:absolute;font-size:38px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.word{padding:7px 10px;border-radius:10px;background:#3d3458;font:600 14px var(--display);border:2px solid #000}
.word.on{background:var(--blue)}
.vid{height:300px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:90px;position:relative;overflow:hidden}
.vid .cap{position:absolute;left:10px;right:56px;bottom:10px;font:700 14px var(--body);text-align:left}
.vid .side{position:absolute;right:8px;bottom:14px;display:flex;flex-direction:column;gap:12px;font-size:22px;text-align:center}
/* doors */
#doors{position:absolute;inset:0;z-index:45;background:rgba(10,6,25,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#doors h1{font:700 clamp(26px,7vw,44px) var(--display);color:var(--gold);margin:0;text-align:center;line-height:1.05}
#doors .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.door{width:min(200px,42vw);height:min(260px,48vh);border-radius:18px 18px 6px 6px;border:5px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:700 28px var(--display);box-shadow:0 8px 0 #000}
.door small{font:700 12px var(--body);padding:0 10px;text-align:center}
.door.lose{background:linear-gradient(#ff6fb0,#c4245f)}
.door.gain{background:linear-gradient(#5c9bff,#2347b8)}
#doors .note{font-size:12px;opacity:.85;text-align:center;max-width:420px}
/* cinematic */
#cine{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,0);transition:background .6s}
#cine.on{background:rgba(0,0,0,.5)}
.lb{position:absolute;left:0;right:0;height:9%;background:#000;transition:transform .6s}
.lb.t{top:0;transform:translateY(-100%)}.lb.b{bottom:0;transform:translateY(100%)}
#cine.on .lb{transform:none}
.stripe{position:absolute;left:-5%;width:110%;top:11%;height:48px;transform:rotate(-2deg) scale(3);opacity:0;background:repeating-linear-gradient(45deg,#141414 0 14px,transparent 14px 28px) left/12% 100% no-repeat,repeating-linear-gradient(45deg,#141414 0 14px,transparent 14px 28px) right/12% 100% no-repeat,linear-gradient(90deg,#ffdc32,#ffa014);display:flex;align-items:center;justify-content:center;font:900 clamp(20px,5.5vw,38px) var(--body);color:#141414;letter-spacing:2px;padding:0 max(60px,12%);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#cine.on .stripe{transform:rotate(-2deg) scale(1);opacity:1}
.ncard{position:absolute;left:50%;top:20%;transform:translate(-50%,120%);width:min(860px,calc(100% - 24px));max-height:70%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px;border:4px solid var(--pink);padding:16px 16px 74px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);display:grid;grid-template-columns:110px 1fr;gap:6px 14px}
#cine.on .ncard{transform:translate(-50%,0)}
.drw{text-align:center}
.drw .b{font-size:74px;line-height:84px;position:relative;display:inline-block;transition:transform .08s}
.drw .g{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:34px}
.drw .n{font:700 12px var(--body);color:#5a465a}
.ntop{font:900 17px var(--body);color:#dc1e3c;line-height:1.25;margin-bottom:6px}
.nbody{font:500 clamp(15px,3.6vw,19px) var(--body);line-height:1.45;min-height:5em}
.nbody b{font-weight:800}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kchip{padding:4px 10px;border-radius:10px;color:#fff;font:900 13px var(--body);animation:bounce .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes bounce{from{transform:scale(0)}to{transform:scale(1)}}
.nart{grid-column:1/-1;display:flex;justify-content:center;gap:10px;font:900 30px var(--body);flex-wrap:wrap;min-height:40px}
.nart span{animation:bounce .45s cubic-bezier(.3,1.8,.5,1) both}
.nnext{position:absolute;right:14px;bottom:12px;padding:10px 22px;border-radius:14px;color:#fff;font:900 20px var(--body);border:2px solid rgba(0,0,0,.4);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 24px rgba(255,210,60,.9)}}
.nwait{position:absolute;right:16px;bottom:18px;font:700 14px var(--body);color:#968c96}
.nopt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border-radius:10px;background:#46465a;font:700 16px var(--body)}
.shake{animation:shk .3s}
@keyframes shk{20%{transform:translate(-50%,0) translateX(-9px)}40%{transform:translate(-50%,0) translateX(9px)}60%{transform:translate(-50%,0) translateX(-6px)}80%{transform:translate(-50%,0) translateX(6px)}}
/* full screen scenes */
.scene{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));gap:12px}
.big{font:700 clamp(30px,9vw,72px) var(--display);line-height:1}
.paper{background:#f5f0e1;color:#141414;width:min(520px,90%);padding:14px;transform:rotate(-3deg);box-shadow:0 10px 30px #000;animation:spin .7s cubic-bezier(.3,1.4,.5,1)}
.paper .h{font:700 24px "Cormorant Garamond",serif;border-bottom:3px double #333;padding-bottom:4px}
.paper .l{font:900 clamp(20px,5vw,32px) var(--body);margin:12px 0}
@keyframes spin{from{transform:rotate(720deg) scale(.05)}}
.shakeAll{animation:sa .08s infinite}
@keyframes sa{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}}

/* 1.5: brain wipe, conversation scenes, loading, recap, photo mode, squishy buttons */
button:active{transform:scale(.94)}
#wipe{position:absolute;inset:0;z-index:95;pointer-events:none;display:flex;align-items:center;justify-content:center;background:#ff5aa9;clip-path:circle(0% at 50% 50%)}
#wipe span{font-size:120px}
#wipe.in{animation:wipeIn .5s ease-in forwards}#wipe.out{animation:wipeOut .5s ease-out forwards}
@keyframes wipeIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes wipeOut{from{clip-path:circle(80% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
#conv{position:absolute;inset:0;z-index:70;pointer-events:none}
#conv .lb{transition:transform .5s}#conv.on .lb{transform:none}
#conv .cmeter{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(11% + 6px);background:rgba(15,12,22,.8);border-radius:12px;padding:6px 10px;font:700 13px var(--body);width:190px}
.cbar{height:10px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}.cfill{height:100%;border-radius:6px;transition:width .5s,background .5s}
#conv .csub{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(11% + 8px);width:min(640px,calc(100% - 24px));background:rgba(10,8,16,.82);border-radius:14px;padding:10px 14px;min-height:64px}
.cname{font:800 13px var(--body);color:var(--gold);letter-spacing:.3px}.ctext{font:600 clamp(15px,3.8vw,19px) var(--body);line-height:1.35;margin-top:2px}
#conv .copts{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(11% + 92px);display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 28px));pointer-events:auto;opacity:0;transform:translateX(-30px);transition:all .3s}
#conv .copts.show{opacity:1;transform:none}
.copt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(30,26,44,.92);border:2px solid rgba(255,255,255,.18);font:700 14px var(--body)}
.copt span{flex:none;width:26px;height:26px;border-radius:8px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font:900 14px var(--body)}
.copt:hover{border-color:var(--gold)}
.cskip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(11% + 64px);pointer-events:auto;background:rgba(15,12,22,.8);border-radius:10px;padding:5px 10px;font:700 12px var(--body)}
.cfx{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(11% + 100px);font:900 16px var(--body);animation:rise 1.2s ease-out forwards}
.objection{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-8deg);font:900 clamp(40px,12vw,90px) var(--body);color:#fff;-webkit-text-stroke:4px #c4142a;text-shadow:0 6px 0 #7a0c18;animation:slam .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}}
#loading{position:absolute;inset:0;z-index:99;background:radial-gradient(#3b2a66,#120d1f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));text-align:center;transition:opacity .5s}
#loading .sp{font-size:70px;animation:spinB 1.2s linear infinite}@keyframes spinB{to{transform:rotate(360deg)}}
#loading .t{font:700 22px var(--display)}#loading .f{font:500 14px var(--body);max-width:420px;opacity:.85;line-height:1.4}
body.photo #counter,body.photo #chips,body.photo #corner,body.photo #bottom,body.photo #enterBtn,body.photo #hint,body.photo #toasts,body.photo #hintHelp,body.photo #jumpBtn{display:none!important}
#photoX{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:60;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);font-size:18px;display:none}body.photo #photoX{display:block}

/* 1.6 + interactivity */
#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));z-index:23;background:linear-gradient(#ff8a1d,#e0561a);border:3px solid #000;border-radius:14px;padding:7px 14px;font:700 15px var(--display);text-align:center;max-width:calc(100% - 24px);animation:pulse 1.2s ease-in-out infinite}
#actBtn{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:50%;background:linear-gradient(#ffd23c,#ff8a1d);border:3px solid #000;font-size:28px;z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#actBtn small{font:800 11px var(--body);margin-top:2px}
#phoneBtn{position:relative}#phoneBtn[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;font:800 11px var(--body);display:flex;align-items:center;justify-content:center;border:2px solid #000}
.sms{background:#1f2a22;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px}.sms small{float:right;opacity:.6}
.printer{width:min(300px,80%);background:#2c2c34;border-radius:12px;padding:10px 10px 0;border:3px solid #000}.printer .slot{height:8px;background:#000;border-radius:4px}
.tagcard{background:#fff;color:#111;border-radius:10px;margin-top:-4px;padding:12px;display:flex;flex-direction:column;gap:2px;animation:print 1.2s ease-out both}.tagcard small{font:800 10px var(--body);color:#3a7bff}.tagcard b{font:800 22px var(--body);min-height:28px}.tagcard span{font:600 12px var(--body);color:#555}

function toStick(wx,wy,str){const l=Math.hypot(wx,wy)||1;wx/=l;wy/=l;const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);return[(wx*rx+wy*rz)*str,-(wx*fx+wy*fz)*str]}
function dumbInput(ix,iz){if(!S.path||S.dead)return[ix,iz];const k=stageK(),lk=look();const mv=Math.hypot(ix,iz);
  if(lk==='nonsense'&&!lagUntil&&mv>.1&&Math.random()<.003){lagUntil=Date.now()+7000;toast('🌀 BRAIN LAG! Your controls are flipped!');snd('boing')}
  if(lagUntil&&Date.now()>lagUntil){lagUntil=0;toast('🧠 Controls are back to normal.')}
  if(lagUntil){ix=-ix;iz=-iz}
  if(k==='octopus'&&mv>.1&&Math.sin(T*1.7)>.85){ix=-ix}
  if(lk==='nonsense'&&mv>.1){ix+=Math.sin(T*3)*.35;iz+=Math.cos(T*2.3)*.25}

  if(k==='mouse'){let best=null,bd=120;for(const n of npcs){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<bd){bd=d;best=n}}if(best){if(!mouseTold){mouseTold=1;toast('🐭 Eek! People are HUGE and scary. You run away on your own.')}const[a,b]=toStick(P.x-best.x,P.y-best.y,.9);return[ix+a,iz+b]}}

    if(t)return toStick(t.x-P.x,t.y-P.y,k==='bee'?.45:.55)}
  return[ix,iz]}
